name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Go build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race -count=1 -coverprofile=coverage.out ./... 2>&1 | tee test.log; then
            # краткая выжимка упавших тестов в аннотацию, чтобы было видно прямо в PR
            msg=$(grep -E -- '--- FAIL|_test.go:[0-9]+|Error:|expected|actual|panic|cannot|undefined' test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test failed::${msg}"
            exit 1
          fi

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
          only-new-issues: true
