version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_hr_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_hr_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_hr_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_hr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ai_hr_user} -d $${POSTGRES_DB:-ai_hr_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: redis_db
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_hr_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-admin}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_WEB_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ai_hr_network
    restart: unless-stopped

  temporal:
    container_name: temporal
    depends_on:
      - postgres
    environment:
      - DB=postgres12_pgx
      - DB_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/config/dynamicconfig/development-sql.yaml
      # - TEMPORAL_CONFIG_FILE=/etc/temporal/config/static-config.yml
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      # --- Настройки для скрипта инициализации (setup) ---
      # Включает TLS для создания схем и миграций
      # - POSTGRES_TLS_ENABLED=true
      # - POSTGRES_TLS_DISABLE_HOST_VERIFICATION=true
      # - SQL_TLS_ENABLED=true
      # - SQL_HOST_VERIFICATION=false # или SQL_TLS_DISABLE_HOST_VERIFICATION (зависит от версии) 
      # Метрики для prometheus
      # - PROMETHEUS_ENDPOINT=0.0.0.0:9081
    image: temporalio/auto-setup
    ports:
      - 127.0.0.1:7233:7233
      # - 0.0.0.0:9081:9081 # Порт для метрик prometheus
    volumes:
      - ./docker/dynamicconfig:/etc/temporal/config/dynamicconfig
    networks:
      - ai_hr_network
    restart: always

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools
    stdin_open: true
    tty: true
    networks:
      - ai_hr_network
    restart: always

  temporal-setup:
    container_name: temporal-setup
    image: temporalio/admin-tools
    depends_on:
      - temporal
    networks:
      - ai_hr_network
    command: >
      bash -c " until tctl cluster health; do echo 'Waiting for Temporal...'; sleep 1; done; tctl --namespace ai-screener namespace register || true; echo 'Namespace registered' "
    restart: "no"

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    image: temporalio/ui
    ports:
      - 127.0.0.1:8085:8080
    networks:
      - ai_hr_network
    restart: always

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    container_name: auth_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:50052:50052"
    networks:
      - ai_hr_network
    restart: unless-stopped

  hiring:
    build:
      context: .
      dockerfile: docker/hiring/Dockerfile
    container_name: hiring_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      temporal:
        condition: service_started
      auth:
        condition: service_started
      ai_engine:
        condition: service_started
    ports:
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:50051:50051"
    networks:
      - ai_hr_network
    restart: unless-stopped

  ai_engine:
    build:
      context: .
      dockerfile: docker/ai_engine/Dockerfile
    container_name: ai_engine_service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      temporal:
        condition: service_started
    ports:
      - "127.0.0.1:50053:50053"
    networks:
      - ai_hr_network
    restart: unless-stopped

  ai_worker:
    build:
      context: .
      dockerfile: docker/ai_worker/Dockerfile
    container_name: ai_worker
    depends_on:
      - temporal
      - ai_engine
    networks:
      - ai_hr_network
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: docker/notification/Dockerfile
    container_name: notification_service
    depends_on:
      - rabbitmq
    networks:
      - ai_hr_network
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: web_frontend
    depends_on:
      auth:
        condition: service_started
      hiring:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ai_hr_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  temporal_data:


networks:
  ai_hr_network:
    driver: bridge
